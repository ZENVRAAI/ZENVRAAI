name: ZENVRA AI autonomous market scanner

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenvra-autonomous-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run software safety tests
        run: pytest -q

      - name: Scan liquid Bybit USDT perpetual markets
        env:
          SCAN_TOP_N: "50"
          MIN_TURNOVER_USDT: "5000000"
          SCAN_CONCURRENCY: "6"
        run: python scripts/scan_market.py

      - name: Publish scan summary in workflow
        if: always()
        run: |
          if [ -f scan-output/scan-report.md ]; then
            cat scan-output/scan-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ZENVRA AI scan did not produce a report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save JSON and Markdown reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenvra-autonomous-scan-${{ github.run_number }}
          path: scan-output/
          if-no-files-found: warn
          retention-days: 14
