name: ZENVRA AI scheduled market scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenvra-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run existing safety tests
        run: pytest -q

      - name: Scan public Bybit linear Futures market data
        run: python scripts/scan_market.py

      - name: Save scan report
        uses: actions/upload-artifact@v4
        with:
          name: zenvra-scan-report
          path: scan-report.md
          if-no-files-found: error
          retention-days: 7
